# Local stack: Postgres + the app on http://localhost:4000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saaserp
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://saaserp_app:saaserp_app@db:5432/saaserp
      MIGRATION_DATABASE_URL: postgres://saaserp_owner:saaserp_owner@db:5432/saaserp
      # Set JWT_SECRET in a .env file next to this one (see README).
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGIN: http://localhost:4000
      # New workspaces wait for approval at /platform. Set to "true" to skip review.
      AUTO_APPROVE_SIGNUPS: ${AUTO_APPROVE_SIGNUPS:-false}
      # Optional Slack/Teams/Zapier incoming-webhook URL pinged on every new sign-up.
      SIGNUP_WEBHOOK_URL: ${SIGNUP_WEBHOOK_URL:-}
    ports: ["${APP_PORT:-4000}:4000"]
    restart: unless-stopped
volumes:
  pgdata:
